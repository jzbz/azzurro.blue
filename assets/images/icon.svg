<?xml version="1.0" encoding="UTF-8"?>
<!--
  The application icon, vendored verbatim from the repository at
  crates/azzurro-gui/desktop/blue.azzurro.Azzurro.svg, so the tab, the card
  and the launcher entry are one picture rather than three drawings of it.

  Lucide's `audio-lines` on a ground of its own — the same glyph set the
  interface uses, ISC licensed. The blue is the light-theme accent, fixed:
  the app follows the system theme, but nothing asks an icon to redraw when
  the theme changes, and neither does a favicon.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.45" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#ground)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#sheen)"/>

  <g transform="translate(36.8 36.8) scale(7.6)"
     fill="none" stroke="#ffffff" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 10v3"/>
    <path d="M6 6v11"/>
    <path d="M10 3v18"/>
    <path d="M14 8v7"/>
    <path d="M18 5v13"/>
    <path d="M22 10v3"/>
  </g>
</svg>
