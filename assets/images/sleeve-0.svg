<?xml version="1.0" encoding="UTF-8"?>
<!--
  An invented sleeve — "Lantern Season".

  The page needs cover art it is free to publish, and the application's own
  metainfo file makes the same point about screenshots: a controller
  necessarily shows somebody's library, so what it shows here has to be made
  rather than grabbed.

  Each of these carries some near-black, some blown white and some flat grey on
  purpose, because a sleeve that is nothing but saturated colour would let the
  demo below discard nothing and teach nothing. Those are the three things
  `dominant()` throws away.

  One file serves two purposes. The window above draws it as a CSS background;
  the colour demo loads this same file into a canvas and runs artwork.rs's
  arithmetic over its pixels — so the swatch being measured is the sleeve being
  shown, rather than a second drawing of it.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#efa94f"/><stop offset="1" stop-color="#93370f"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="#0b0b0d"/>
  <rect x="0" y="0" width="200" height="146" fill="url(#g)"/>
  <circle cx="100" cy="74" r="40" fill="#fcfcfa"/>
  <circle cx="100" cy="74" r="40" fill="none" stroke="#0b0b0d" stroke-width="4"/>
  <rect x="0" y="146" width="200" height="6" fill="#9a9d9f"/>
  <g fill="#fcfcfa">
    <rect x="20" y="164" width="96" height="7"/><rect x="20" y="178" width="58" height="7"/>
  </g>
</svg>
